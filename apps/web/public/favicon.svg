<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f3ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bc13fe;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="100" height="100" fill="#050505"/>
  <circle cx="50" cy="50" r="35" fill="none" stroke="url(#grad)" stroke-width="3" filter="url(#glow)"/>
  <circle cx="50" cy="50" r="25" fill="none" stroke="#00f3ff" stroke-width="2" opacity="0.5"/>
  <circle cx="50" cy="50" r="8" fill="#00f3ff" filter="url(#glow)"/>
  <text x="50" y="55" font-family="Arial" font-size="12" fill="#00f3ff" text-anchor="middle" font-weight="bold">Ω</text>
</svg>
