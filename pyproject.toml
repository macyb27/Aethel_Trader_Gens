[project]
name = "aether-trader"
version = "0.0.0"
description = "Aether Trader – autonomes KI-Handelssystem (quanten-inspirierte Komponenten, Agenten, Paper-Trading)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Aether Trader" }]

dependencies = [
  "numpy>=1.26",
  "pydantic>=2.5",
  "pydantic-settings>=2.1",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.8.0",
  "pytest>=8.0.0",
]
quantum = [
  "torch>=2.2",
]
vectors = [
  "chromadb>=0.5",
  "faiss-cpu>=1.8.0",
]
all = [
  "ruff>=0.8.0",
  "pytest>=8.0.0",
  "torch>=2.2",
  "chromadb>=0.5",
  "faiss-cpu>=1.8.0",
]

[project.scripts]
aether-superbot = "agents.orchestrator:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.setuptools.packages.find]
where = ["."]
include = ["quantum_inspired*", "agents*", "strategy_memory*"]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"
