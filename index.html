<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ÆTHER-TRADER Ω v4.0 - Self-Aware Market Oracle">
  <meta name="theme-color" content="#050505">
  <title>ÆTHER-TRADER Ω v4.0</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    /* Critical CSS - Dark Nebula Base */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #root {
      width: 100%;
      min-height: 100%;
      background: #050505;
      color: #00f3ff;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
    }
    /* Preloader */
    .preloader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at center, #0a0a0a 0%, #050505 100%);
      z-index: 9999;
    }
    .preloader-ring {
      width: 120px;
      height: 120px;
      border: 3px solid transparent;
      border-top-color: #00f3ff;
      border-bottom-color: #bc13fe;
      border-radius: 50%;
      animation: spin 1.5s linear infinite;
    }
    .preloader-text {
      margin-top: 24px;
      font-size: 14px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #00f3ff;
      text-shadow: 0 0 10px #00f3ff40;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="preloader">
      <div class="preloader-ring"></div>
      <div class="preloader-text">Initializing Oracle...</div>
    </div>
  </div>
  <script type="module" src="/src/index.tsx"></script>
</body>
</html>
