[package]
name = "aether-trader-omega"
version = "4.0.0"
description = "ÆTHER-TRADER Ω v4.0 - Self-Aware Market Oracle"
authors = ["Macyb <macyb@aether.trading>"]
edition = "2021"
rust-version = "1.70"

[lib]
name = "aether_trader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
# Tauri Core
tauri = { version = "2.0", features = [] }
tauri-plugin-shell = "2.0"

# Async Runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
rusqlite = { version = "0.31", features = ["bundled"] }

# WebSocket
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
futures-util = "0.3"

# Crypto & Hashing
sha2 = "0.10"
hmac = "0.12"
base64 = "0.21"

# Environment
dotenvy = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Random
rand = "0.8"
uuid = { version = "1.7", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
